  <body>
    <div class="container">
      <div class="box">
        <h2 class="verify">Enter Verification Code</h2>

        <div class="input-boxes">
          <input

            name="num"
            id="input"
            maxlength="1"
            autocomplete="off"

          />

          />
        </div>

        <div class="code"></div>

        <div class="icon">
          <i class="primary"></i>
